<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-label="claudethemes.space: themes for the Claude desktop app, made by everyone">
  <style>
    .t { font: 700 64px Outfit, 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #f4f4f4; letter-spacing: -1.5px }
    .s { font: 400 24px Outfit, 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #a8a8a8 }
    .b { font: 600 22px Outfit, 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #f4f4f4 }
    .star { fill: #cfe6ff; animation: tw 5s ease-in-out infinite }
    .star:nth-child(2n) { animation-duration: 7s; animation-delay: -2s }
    .star:nth-child(3n) { animation-duration: 6s; animation-delay: -4s }
    .spark { fill: #ff8a3c; animation: up 9s linear infinite }
    .spark:nth-child(2n) { fill: #ffc56b; animation-duration: 12s; animation-delay: -5s }
    .spark:nth-child(3n) { animation-duration: 10s; animation-delay: -2s }
    @keyframes tw { 0%, 100% { opacity: .15 } 50% { opacity: .95 } }
    @keyframes up { 0% { transform: translateY(0); opacity: 0 } 15% { opacity: .9 } 100% { transform: translateY(-170px); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .star, .spark { animation: none; opacity: .6 } }
  </style>
  <defs>
    <radialGradient id="glow" cx=".18" cy="1.1" r=".9">
      <stop offset="0" stop-color="#d97757" stop-opacity=".34"/>
      <stop offset=".6" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#13203a"/></linearGradient>
    <radialGradient id="coal" cx=".5" cy="1.1" r=".9"><stop offset="0" stop-color="#5a2410"/><stop offset=".6" stop-color="#211511"/><stop offset="1" stop-color="#120f0d"/></radialGradient>
    <clipPath id="c1"><rect x="760" y="60" width="300" height="190" rx="18"/></clipPath>
    <clipPath id="c2"><rect x="920" y="170" width="300" height="190" rx="18"/></clipPath>
  </defs>

  <rect width="1280" height="420" rx="28" fill="#000"/>
  <rect width="1280" height="420" rx="28" fill="url(#glow)"/>

  <g transform="translate(72 84)">
    <rect width="12" height="34" rx="4" fill="#d97757"/>
    <rect x="17" width="12" height="34" rx="4" fill="#d97757" opacity=".65"/>
    <rect x="34" width="12" height="34" rx="4" fill="#d97757" opacity=".35"/>
    <text class="b" x="62" y="25">claudethemes<tspan fill="#8a8a8a">.space</tspan></text>
  </g>
  <text class="t" x="72" y="214">Themes for the Claude</text>
  <text class="t" x="72" y="286">app, made by <tspan fill="#d97757">everyone</tspan>.</text>
  <text class="s" x="72" y="340">Preview one. Put it on with one paste. Upload your own.</text>

  <g clip-path="url(#c1)">
    <rect x="760" y="60" width="300" height="190" fill="url(#night)"/>
    <g>
      <circle class="star" cx="790" cy="90" r="1.6"/><circle class="star" cx="840" cy="130" r="1.2"/><circle class="star" cx="880" cy="80" r="1.8"/>
      <circle class="star" cx="930" cy="150" r="1.3"/><circle class="star" cx="970" cy="100" r="1.5"/><circle class="star" cx="1010" cy="200" r="1.2"/>
      <circle class="star" cx="820" cy="210" r="1.4"/><circle class="star" cx="900" cy="225" r="1.1"/><circle class="star" cx="1040" cy="140" r="1.7"/>
    </g>
    <circle cx="1014" cy="98" r="15" fill="#dfeaf8"/><circle cx="1008" cy="93" r="15" fill="#0a1020"/>
    <rect x="760" y="60" width="78" height="190" fill="#0e1320" opacity=".7"/>
    <rect x="770" y="80" width="56" height="7" rx="3.5" fill="#3aa7d9"/>
    <rect x="770" y="98" width="58" height="12" rx="4" fill="#e3e9f6" opacity=".14"/>
    <rect x="770" y="118" width="44" height="6" rx="3" fill="#bcc6da" opacity=".5"/>
    <rect x="770" y="132" width="50" height="6" rx="3" fill="#bcc6da" opacity=".5"/>
    <rect x="930" y="80" width="112" height="16" rx="8" fill="#1a2133" opacity=".85"/>
    <rect x="852" y="108" width="150" height="6" rx="3" fill="#e3e9f6" opacity=".8"/>
    <rect x="852" y="124" width="190" height="52" rx="8" fill="#141a2a" opacity=".8"/>
    <rect x="862" y="136" width="70" height="5" rx="2.5" fill="#3aa7d9"/><rect x="862" y="148" width="110" height="5" rx="2.5" fill="#d9a53a"/><rect x="862" y="160" width="54" height="5" rx="2.5" fill="#4fb37a"/>
    <rect x="852" y="214" width="190" height="22" rx="11" fill="#1a2133" opacity=".9"/><rect x="1018" y="218" width="16" height="14" rx="5" fill="#3aa7d9"/>
  </g>
  <rect x="760" y="60" width="300" height="190" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".12"/>

  <g clip-path="url(#c2)">
    <rect x="920" y="170" width="300" height="190" fill="url(#coal)"/>
    <g>
      <circle class="spark" cx="1020" cy="360" r="2.2"/><circle class="spark" cx="1070" cy="360" r="1.6"/><circle class="spark" cx="1120" cy="360" r="2.4"/>
      <circle class="spark" cx="1160" cy="360" r="1.5"/><circle class="spark" cx="1195" cy="360" r="2"/><circle class="spark" cx="1045" cy="360" r="1.4"/>
    </g>
    <rect x="920" y="170" width="78" height="190" fill="#181412" opacity=".7"/>
    <rect x="930" y="190" width="56" height="7" rx="3.5" fill="#e0662b"/>
    <rect x="930" y="208" width="58" height="12" rx="4" fill="#f3e9e2" opacity=".14"/>
    <rect x="930" y="228" width="44" height="6" rx="3" fill="#d3c4ba" opacity=".5"/>
    <rect x="930" y="242" width="50" height="6" rx="3" fill="#d3c4ba" opacity=".5"/>
    <rect x="1090" y="190" width="112" height="16" rx="8" fill="#28211d" opacity=".85"/>
    <rect x="1012" y="218" width="150" height="6" rx="3" fill="#f3e9e2" opacity=".8"/>
    <rect x="1012" y="234" width="190" height="52" rx="8" fill="#201a17" opacity=".8"/>
    <rect x="1022" y="246" width="70" height="5" rx="2.5" fill="#e0662b"/><rect x="1022" y="258" width="110" height="5" rx="2.5" fill="#e0a030"/><rect x="1022" y="270" width="54" height="5" rx="2.5" fill="#7fa650"/>
    <rect x="1012" y="324" width="190" height="22" rx="11" fill="#28211d" opacity=".9"/><rect x="1178" y="328" width="16" height="14" rx="5" fill="#e0662b"/>
  </g>
  <rect x="920" y="170" width="300" height="190" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
</svg>

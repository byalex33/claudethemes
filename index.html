  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Themes: themes for the Claude desktop app</title>
    <meta name="description" content="A community gallery of themes for the Claude desktop app. Preview one, put it on with one paste, or upload the theme Claude made for you. No account needed." />
    <meta property="og:title" content="Claude Themes" />
    <meta property="og:description" content="Find a look for your Claude desktop app, or upload the one Claude made for you. No account needed." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Set the mode before first paint, so a dark-mode visitor never sees a white flash.
      try {
        var m = localStorage.getItem('mode')
        if (m === 'dark' || (m !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

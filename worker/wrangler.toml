# The upload endpoint. Deploy with:  npx wrangler deploy  (from this folder)
# then:  npx wrangler secret put GITHUB_TOKEN
# and put the deployed URL in registry.config.json as "uploadEndpoint".
name = "claudethemes-upload"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Five uploads a minute from one address.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

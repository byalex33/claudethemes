name: Registry
on:
  push:
    branches: [main]
    paths: ['themes/**', 'shared/**', 'template/**', 'scripts/**', 'registry.config.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: registry
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Regenerate the installable mods from themes/, and commit them if they changed.
      # The site itself is built and deployed by Vercel.
      - run: npm run registry
      - name: Commit generated mods
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins .claude-plugin
          git diff --cached --quiet || (git commit -m "chore(registry): regenerate theme mods" && git push)
